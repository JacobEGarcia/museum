<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Museum of Acceleration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0e;font-family:'Marcellus',Georgia,serif;color:#e8e0cf}
  #app{position:fixed;inset:0}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1a22 0%,#050507 100%);z-index:10;transition:opacity 1.2s}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{font-size:clamp(28px,5vw,64px);letter-spacing:.18em;margin:0;font-weight:400;color:#d8c58f;text-transform:uppercase;text-align:center}
  #overlay h2{font-size:clamp(12px,1.4vw,18px);letter-spacing:.5em;margin:14px 0 40px;font-weight:400;color:#8f8674;text-transform:uppercase}
  #enter{font-family:inherit;font-size:15px;letter-spacing:.3em;text-transform:uppercase;padding:14px 44px;background:transparent;border:1px solid #d8c58f;color:#d8c58f;cursor:pointer;transition:all .3s}
  #enter:hover{background:#d8c58f;color:#111}
  #progress{margin-top:26px;font-size:12px;letter-spacing:.2em;color:#6f685c;text-transform:uppercase}
  #plaque{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);max-width:520px;padding:14px 26px;background:linear-gradient(180deg,#3a2f1d,#241c0f);border:1px solid #a8842c;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.6);opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;z-index:5}
  #plaque.show{opacity:1}
  #plaque h3{margin:0 0 4px;font-size:16px;letter-spacing:.12em;color:#e6c97a;text-transform:uppercase}
  #plaque p{margin:0;font-size:13px;font-style:italic;color:#cbbfa4}
  #hint{position:fixed;top:18px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#9a917e;opacity:0;transition:opacity 1s;z-index:5;text-align:center}
  #hint.show{opacity:.85}
  #tour{position:fixed;right:22px;bottom:22px;z-index:5;font-family:inherit;font-size:11px;letter-spacing:.25em;text-transform:uppercase;padding:10px 20px;background:rgba(20,16,10,.7);border:1px solid #6b5a33;color:#cbb87f;cursor:pointer;border-radius:3px}
  #tour:hover{background:#6b5a33;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay">
  <h1>The Museum of Acceleration</h1>
  <h2>Smithsonian of the Future &middot; Est. 2026</h2>
  <button id="enter">Enter the Rotunda</button>
  <div id="progress">Hanging the exhibits&hellip;</div>
</div>
<div id="hint">W A S D to walk &middot; mouse to look &middot; click an exhibit to inspect &middot; esc to release</div>
<div id="plaque"><h3 id="ptitle"></h3><p id="pdesc"></p></div>
<button id="tour">Guided Tour</button>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module" src="./museum.js?v=9"></script>
</body>
</html>
